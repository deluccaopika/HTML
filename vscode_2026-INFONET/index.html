<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pastelaria do Luisinho</title>

         <style>
            h1, label, p {
                font-family:Arial, Helvetica, sans-serif;
            }

            .centralizar {
                text-align:center;
            }

            main {
                display:flex;
                justify-content:center;
            }

            form {
                background-color:rgb(253, 170, 76);
                padding: 20px;
                width: 60%;
                display: grid;
                border-radius: 8px;
            }

            img {
                width: 20%;
                display: block;
                margin: auto;
            }

            .campo {
                margin-bottom: 15px;
            }

            #container-sabores {
                display: flex;
                flex-direction: column;
                margin-bottom: 10px
            }

            .item{
                margin-bottom: 9px;
            }

            button {
                margin-top: 45px;
                height: 50px;
                background-color:rgb(253, 250, 32);
                color:rgb(0, 0, 0);
                border: 0;
                border-radius: 10px;
                font-size: 20px;
                font-weight: bold;
            }

            body {
                background-image: url("imagens/pastel_fundo.jpg");
                background-color: rgba(255, 255, 255, 0.4);
                background-blend-mode: lighten;
                background-repeat: no-repeat;
                background-size: cover;
            }
        </style>

    </head>
    <body>
        <header>
            <img src="imagens/logo.png" alt="">
            <h1 class="centralizar">Formulário de Inscrição</h1>
            <p class="centralizar">Inscrição para experimentar e avaliar os deliciosos pastéis da Pastelaria do Luisinho.</p>
        </header>
        
        <main>
            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" class="campo">

                <label for="email">E-mail:</label>
                <input type="email" id="email" class="campo">

                <label for="tel">Telefone (apenas números):</label>
                <input type="number" id="tel" class="campo">

                <label for="senha">Senha de acesso ao sistema:</label>
                <input type="password" id="senha" class="campo">

                <label for="confirmacao-senha">Confirmação da senha:</label>
                <input type="password" id="confirmacao-senha" class="campo">

                <p>Selecione os sabores favoritos:</p>
                <div id="container-sabores">
                    <label class="item"><input type="checkbox">Queijo</label>
                    <label class="item"><input type="checkbox">Carne</label>
                    <label class="item"><input type="checkbox">Calabresa</label>
                    <label class="item"><input type="checkbox">Palmito</label>
                    <label class="item"><input type="checkbox">Frango com Catupiry</label>
                </div>

                <label for="comentario">Comentários sobre os pastéis:</label>
                <textarea rows="4" id="comentario"></textarea>

                <button type="submit">Enviar inscrição</button>
            </form>
        </main>
    </body>
</html>
