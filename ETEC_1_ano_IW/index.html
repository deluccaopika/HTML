<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulário</title>
    </head>
    <body>
        <header>
            <img src="imagens/logopizza.png">
            <h1>Formulário de inscrição</h1>
            <p>
                Inscrição para experimentar e avaliar as nossas deliciosas pizzas da Pizzaria do deLucca!
            </p>
        </header>

        <main>
            <form>
                <label for="nome">Nome:</label>
                <input type="text" id="nome">

                <label for="email">E-mail:</label>
                <input type="email" id="email">

                <label for="telef">Telefone:</label>
                <input type="tel" id="telef">

                <label for="senha">Senha:</label>
                <input type="password" id="senha">

                <label for="confirmacao-senha">Senha:</label>
                <input type="password" id="confirmacao-senha">
            </form>
        </main>
    </body>
</html>
